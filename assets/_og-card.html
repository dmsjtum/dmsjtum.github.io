<!-- SOURCE FOR assets/og.png — not a page. The underscore keeps it out of
     the published site. Regenerate after changing the drawing or the wording:

       cd assets && "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
         --window-size=1200,630 --screenshot=og-2x.png file://$PWD/_og-card.html
       # then downsample 2400x1260 -> 1200x630 (LANCZOS) and save as og.png

     The drawing is the live one from index.html, pasted here and frozen at
     t=1.305s: elbow bent so the arm reads as articulated, hopper at the top of
     its arc, quadrotor mid-flight with T* still ahead of it and unobscured.
     Later frames park the quadrotor on top of the T* marker and hide it. -->
<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@200..900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Signifier";src:url("fonts/signifier-regular.woff2") format("woff2");font-weight:400;font-display:block}
:root{--paper:#faf9f5;--desk:#d6d1c0;--ink:#0a0a0a;--ink-3:rgba(10,10,10,.42);
      --rule:rgba(10,10,10,.13);--accent:#b8402a;
      --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
      --sans:"Source Sans 3",-apple-system,"PingFang SC",sans-serif;
      --serif:"Signifier","Songti SC",Georgia,serif}
*{box-sizing:border-box}
body{width:1200px;height:630px;margin:0;background:var(--desk);
     padding:30px 44px 44px 34px;font-family:var(--mono);color:var(--ink)}
.sheet{width:100%;height:100%;background:var(--paper);border:1px solid var(--ink);
       box-shadow:10px 10px 0 var(--ink);display:grid;
       grid-template-columns:1fr 330px;align-items:center;gap:24px;padding:0 34px 0 54px}
.eyebrow{font:400 15px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
h1{font:400 64px/1.06 var(--serif);margin:24px 0 0;letter-spacing:-.005em;white-space:nowrap}
h1 .zh{color:var(--accent)}
.hr{border:0;border-top:1px solid var(--rule);margin:26px 0 20px}
.desc{font-family:var(--sans);font-weight:350;font-size:24px;line-height:1.44;margin:0;max-width:28ch}
.url{font:400 16px/1 var(--mono);letter-spacing:.06em;color:var(--ink-3);margin-top:30px}
.sketch{display:block;color:var(--ink);opacity:.82;margin-left:auto}
.accent{color:var(--accent)}
</style>
<div class="sheet">
  <div>
    <div class="eyebrow">MSR &middot; University of Pennsylvania</div>
    <h1>Miaomiao Dai <span class="zh">&#20195;&#28156;&#28156;</span></h1>
    <hr class="hr">
    <p class="desc">Trajectory optimization and robot learning. HOP, RSS 2026.</p>
    <div class="url">dmsjtum.github.io</div>
  </div>
  <div><svg class="sketch" width="330" height="330" viewBox="6 40 194 194" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- One bench, two systems: the arm policies get deployed on, and
               the quadrotor HOP is validated on. Joint angles are IK-solved
               (scratchpad/ik.py), and the pose sequence starts and ends on the
               same pose so the loop seam has nothing to jump across. The flight
               path is kept above y=112 while the arm tops out near y=156. -->

          <path d="M 6 226 L 194 226" stroke="currentColor" stroke-width="1.1" opacity=".45"/>

          <!-- flight path, entirely in the sky -->
          <path id="traj" d="M 44 112 C 80 56 130 50 176 84"/>
          <path d="M 44 112 C 80 56 130 50 176 84"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                stroke-dasharray="0.1 10" opacity=".3">
            <animate attributeName="stroke-dashoffset" values="0;-10" dur="1.5s" repeatCount="indefinite"/>
          </path>

          <!-- T*: the horizon HOP selects. The one accent in the drawing. -->
          <g class="accent">
            <circle cx="176" cy="84" r="4.5" stroke="currentColor" stroke-width="1.5">
              <animate attributeName="r" values="4.5;7;4.5" dur="2.8s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values=".95;.4;.95" dur="2.8s" repeatCount="indefinite"/>
            </circle>
            <text x="168" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
                  font-size="9" fill="currentColor">T*</text>
          </g>

          <!-- quadrotor: out to T*, hold, back again -->
          <g>
            <animateMotion dur="9s" repeatCount="indefinite"
                           keyPoints="0;1;1;0;0" keyTimes="0;0.38;0.50;0.88;1"
                           calcMode="spline"
                           keySplines=".45 0 .3 1; 0 0 1 1; .45 0 .3 1; 0 0 1 1">
              <mpath href="#traj"/>
            </animateMotion>
            <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <path d="M -10 -2 L 10 -2"/>
              <path d="M -10 -2 L -10 -6"/>
              <path d="M  10 -2 L  10 -6"/>
              <ellipse cx="-10" cy="-7" rx="6.5" ry="1.5">
                <animate attributeName="rx" values="6.5;2;6.5" dur="0.42s" repeatCount="indefinite"/>
              </ellipse>
              <ellipse cx="10" cy="-7" rx="6.5" ry="1.5">
                <animate attributeName="rx" values="2;6.5;2" dur="0.42s" repeatCount="indefinite"/>
              </ellipse>
              <rect x="-4.5" y="-2" width="9" height="5.5" rx="1.5"/>
            </g>
          </g>

          <!-- A hopper on the empty pad under T*. Third morphology on the
               bench: the arm manipulates, the quadrotor flies, this one only
               knows how to leave the ground. One hop is 0.9s — exactly a tenth
               of the 9s master loop, so it lands on the same beat every time
               the arm sets the cube down. Rise and fall are separate splines
               fitted to a parabola: slope 2 leaving the ground, 0 at the apex,
               2 coming back down. Base poses are the standing pose, so it
               freezes upright rather than mid-crouch under reduced motion. -->
          <g transform="translate(172 226)" stroke="currentColor"
             stroke-width="1.4" stroke-linecap="round">
            <g>
              <animateTransform attributeName="transform" type="translate"
                values="0 0; 0 0; 0 -11; 0 0; 0 0"
                keyTimes="0; 0.10; 0.50; 0.90; 1"
                dur="0.9s" repeatCount="indefinite" calcMode="spline"
                keySplines="0 0 1 1; .25 .5 .45 1; .55 0 .75 .5; 0 0 1 1"/>

              <!-- Legs load through the push-off and absorb after touchdown.
                   Feet splay wider as the hip drops, so the crouch reads as
                   weight rather than as the whole robot shrinking. -->
              <path d="M -5.5 0 L -3 0 L -1.4 -6">
                <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
                  keyTimes="0; 0.10; 0.90; 0.98; 1"
                  values="M -6.5 0 L -4 0 L -1.4 -4;
                          M -5.5 0 L -3 0 L -1.4 -6;
                          M -5.5 0 L -3 0 L -1.4 -6;
                          M -6.5 0 L -4 0 L -1.4 -4;
                          M -6.5 0 L -4 0 L -1.4 -4"/>
              </path>
              <path d="M 5.5 0 L 3 0 L 1.4 -6">
                <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
                  keyTimes="0; 0.10; 0.90; 0.98; 1"
                  values="M 6.5 0 L 4 0 L 1.4 -4;
                          M 5.5 0 L 3 0 L 1.4 -6;
                          M 5.5 0 L 3 0 L 1.4 -6;
                          M 6.5 0 L 4 0 L 1.4 -4;
                          M 6.5 0 L 4 0 L 1.4 -4"/>
              </path>

              <!-- Body rides the hip down through the crouch: 2px, the same
                   distance the hip travels, so nothing telescopes. -->
              <g>
                <animateTransform attributeName="transform" type="translate"
                  values="0 2; 0 0; 0 0; 0 2; 0 2"
                  keyTimes="0; 0.10; 0.90; 0.98; 1"
                  dur="0.9s" repeatCount="indefinite"/>
                <rect x="-6" y="-16" width="12" height="10" rx="1.8"/>
                <circle cx="0" cy="-11" r="2.1"/>
                <path d="M 0 -16 L 0 -20"/>
                <circle cx="0" cy="-21.2" r="1.2"/>
              </g>
            </g>
          </g>

          <!-- Arm assembly scaled 1.18x about the bench: translate = (1-s)*anchor. -->
          <g transform="translate(-8.6 -40.7) scale(1.18)">
            <rect x="-6" y="-6" width="12" height="12" rx="1.5"
                  stroke="currentColor" stroke-width="1.4">
              <animateTransform attributeName="transform" type="translate"
                values="94 219; 94 172; 22 172; 22 219; 22 219; 22 172; 94 172; 94 219; 94 219"
                keyTimes="0; 0.10; 0.26; 0.36; 0.46; 0.56; 0.72; 0.82; 1"
                dur="9s" repeatCount="indefinite" calcMode="spline"
                keySplines=".4 0 .2 1; .4 0 .2 1; .4 0 .2 1; 0 0 1 1; .4 0 .2 1; .4 0 .2 1; .4 0 .2 1; 0 0 1 1"/>
            </rect>

            <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M 32 226 L 64 226"/>
              <path d="M 42 226 L 42 204 L 54 204 L 54 226"/>

              <g transform="translate(48 200)">
                <animateTransform attributeName="transform" type="rotate"
                  values="136.2; 63.1; 4.2; -69.9; -69.9; 4.2; 63.1; 136.2; 136.2"
                  keyTimes="0; 0.10; 0.26; 0.36; 0.46; 0.56; 0.72; 0.82; 1"
                  dur="9s" repeatCount="indefinite" additive="sum" calcMode="spline"
                  keySplines=".4 0 .2 1; .4 0 .2 1; .4 0 .2 1; 0 0 1 1; .4 0 .2 1; .4 0 .2 1; .4 0 .2 1; 0 0 1 1"/>
                <path d="M 0 0 L 0 -26"/>
                <circle cx="0" cy="0" r="2.4"/>

                <g transform="translate(0 -26)">
                  <animateTransform attributeName="transform" type="rotate"
                    values="-45.7; -8.5; -90.0; -106.9; -106.9; -90.0; -8.5; -45.7; -45.7"
                    keyTimes="0; 0.10; 0.26; 0.36; 0.46; 0.56; 0.72; 0.82; 1"
                    dur="9s" repeatCount="indefinite" additive="sum" calcMode="spline"
                    keySplines=".4 0 .2 1; .4 0 .2 1; .4 0 .2 1; 0 0 1 1; .4 0 .2 1; .4 0 .2 1; .4 0 .2 1; 0 0 1 1"/>
                  <path d="M 0 0 L 0 -28"/>
                  <circle cx="0" cy="0" r="2.2"/>

                  <!-- gripper eases open only while the cube rests on the bench -->
                  <g transform="translate(0 -28)">
                    <path d="M -5 0 L 5 0"/>
                    <!-- Base d is the closed pose: reduced motion switches the
                         <animate> off, and without it the fingers had no d at
                         all and vanished. -->
                    <path d="M -3 0 L -3 6.5">
                      <animate attributeName="d" dur="9s" repeatCount="indefinite"
                        keyTimes="0; 0.38; 0.42; 0.44; 0.48; 1"
                        values="M -3 0 L -3 6.5; M -3 0 L -3 6.5; M -6 0 L -6 6.5; M -6 0 L -6 6.5; M -3 0 L -3 6.5; M -3 0 L -3 6.5"/>
                    </path>
                    <path d="M 3 0 L 3 6.5">
                      <animate attributeName="d" dur="9s" repeatCount="indefinite"
                        keyTimes="0; 0.38; 0.42; 0.44; 0.48; 1"
                        values="M 3 0 L 3 6.5; M 3 0 L 3 6.5; M 6 0 L 6 6.5; M 6 0 L 6 6.5; M 3 0 L 3 6.5; M 3 0 L 3 6.5"/>
                    </path>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </svg></div>
</div>
<script>
  const s=document.querySelector("svg.sketch");
  s.pauseAnimations(); s.setCurrentTime(1.305);
</script>
