<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
  <title id="t">Control-faithful world models: method overview</title>
  <desc id="d">A frozen VLA publishes a plan. Camera and proprioception history are encoded into a latent state. One latent world model F(z, a) is linearized along the plan to give A_k and B_k, which a Riccati controller re-solves at every step to add a bounded correction to the VLA's action. Offline, push-and-see pairs supervise F so its local responses match measured ones.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a0a0a"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8402a"/></marker>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #0a0a0a; }
      .mono { font-family: Menlo, "SF Mono", SFMono-Regular, "DejaVu Sans Mono", monospace; fill: #4a4a46; }
      .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #0a0a0a; }
      .ttl { font-size: 19px; font-weight: 600; }
      .txt { font-size: 16px; }
      .sm  { font-size: 14px; }
      .acc { fill: #b8402a; }
      .box { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.5; }
      .shadow { fill: #0a0a0a; }
      .core { fill: #fffaf6; stroke: #b8402a; stroke-width: 2.5; }
      .wire { stroke: #0a0a0a; stroke-width: 1.6; fill: none; }
      .wire-a { stroke: #b8402a; stroke-width: 1.8; fill: none; }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="540" fill="#faf9f5"/>

  <!-- Frozen VLA -->
  <rect class="shadow" x="23" y="23" width="190" height="84" rx="4"/>
  <rect class="box" x="20" y="20" width="190" height="84" rx="4"/>
  <text class="sans ttl" x="36" y="50">Frozen VLA</text>
  <text class="mono sm" x="36" y="72">π0.5 · OpenVLA-OFT</text>
  <text class="sans sm" x="36" y="93">publishes a plan <tspan class="math">ā</tspan></text>

  <!-- plan wire: VLA -> core (top) and -> robot (top) -->
  <path class="wire" d="M210,62 H500 V133" marker-end="url(#ar)"/>
  <path class="wire" d="M500,62 H915 V173" marker-end="url(#ar)"/>
  <text class="mono sm" x="228" y="54">plan ā · once per replan</text>

  <!-- Camera + proprio history -->
  <rect class="shadow" x="23" y="178" width="150" height="120" rx="4"/>
  <rect class="box" x="20" y="175" width="150" height="120" rx="4"/>
  <text class="sans ttl" x="34" y="203">Observations</text>
  <text class="sans txt" x="34" y="228">camera +</text>
  <text class="sans txt" x="34" y="249">proprioception</text>
  <text class="sans txt" x="34" y="270">history</text>

  <path class="wire" d="M170,235 H203" marker-end="url(#ar)"/>

  <!-- Latent state -->
  <rect class="shadow" x="208" y="178" width="140" height="120" rx="4"/>
  <rect class="box" x="205" y="175" width="140" height="120" rx="4"/>
  <text class="sans ttl" x="219" y="203">Latent state</text>
  <text class="math txt" x="219" y="231" font-size="20">z<tspan dy="5" font-size="14">k</tspan></text>
  <text class="sans sm" x="219" y="258">frozen features</text>
  <text class="sans sm" x="219" y="277">+ a small map</text>

  <path class="wire" d="M345,235 H378" marker-end="url(#ar)"/>

  <!-- Core: one latent dynamics model -->
  <rect class="shadow" x="384" y="138" width="232" height="196" rx="4"/>
  <rect class="core" x="381" y="135" width="232" height="196" rx="4"/>
  <text class="sans ttl acc" x="397" y="163">Latent world model</text>
  <text class="math txt" x="397" y="196" font-size="20">z<tspan dy="5" font-size="14">k+1</tspan><tspan dy="-5"> = F(z</tspan><tspan dy="5" font-size="14">k</tspan><tspan dy="-5">, a</tspan><tspan dy="5" font-size="14">k</tspan><tspan dy="-5">)</tspan></text>
  <line x1="397" y1="214" x2="597" y2="214" stroke="#b3b2ae" stroke-width="1"/>
  <text class="sans sm" x="397" y="236">linearize along the plan:</text>
  <text class="math txt" x="397" y="266" font-size="19">A<tspan dy="5" font-size="13">k</tspan><tspan dy="-5"> = ∂F/∂z</tspan></text>
  <text class="math txt" x="505" y="266" font-size="19">B<tspan dy="5" font-size="13">k</tspan><tspan dy="-5"> = ∂F/∂a</tspan></text>
  <text class="sans sm" x="397" y="292">how the scene propagates,</text>
  <text class="sans sm" x="397" y="311">how an action nudge moves it</text>

  <path class="wire" d="M613,235 H651" marker-end="url(#ar)"/>
  <text class="math sm" x="619" y="226">A, B</text>

  <!-- Riccati -->
  <rect class="shadow" x="659" y="178" width="178" height="120" rx="4"/>
  <rect class="box" x="656" y="175" width="178" height="120" rx="4"/>
  <text class="sans ttl" x="670" y="203">Riccati</text>
  <text class="sans txt" x="670" y="228">re-solved every</text>
  <text class="sans txt" x="670" y="249">control step,</text>
  <text class="sans txt" x="670" y="270">box limits</text>

  <path class="wire" d="M834,235 H866" marker-end="url(#ar)"/>
  <text class="math sm" x="838" y="226">δa</text>

  <!-- Robot -->
  <rect class="shadow" x="873" y="178" width="110" height="120" rx="4"/>
  <rect class="box" x="870" y="175" width="110" height="120" rx="4"/>
  <text class="sans ttl" x="884" y="203">Robot</text>
  <text class="math txt" x="884" y="238">a<tspan dy="5" font-size="13">k</tspan><tspan dy="-5"> =</tspan></text>
  <text class="math txt" x="884" y="262">ā<tspan dy="5" font-size="13">k</tspan><tspan dy="-5"> + δa</tspan><tspan dy="5" font-size="13">k</tspan></text>

  <!-- feedback loop -->
  <path class="wire" d="M925,295 V352 H95 V297" marker-end="url(#ar)"/>
  <text class="mono sm" x="110" y="370">next observation</text>

  <!-- reuse note under Riccati -->
  <text class="sans sm" x="656" y="322">new goal, limits or latency</text>
  <text class="sans sm" x="656" y="340" fill="#0a0a0a">= new Riccati inputs, same F</text>

  <!-- Training band -->
  <rect x="20" y="378" width="960" height="146" rx="6" fill="#f2f0e8" stroke="#b8402a" stroke-width="1.5" class="dash"/>
  <text class="mono sm acc" x="36" y="402">OFFLINE TRAINING · push-and-see pairs</text>
  <text class="sans txt" x="36" y="430">Rerun the same plan with a small push ±δ</text>
  <text class="sans txt" x="36" y="452">at step j; hold every later command fixed.</text>
  <text class="sans txt" x="36" y="474">Fit F so its response to the push matches</text>
  <text class="sans txt" x="36" y="496">the measured one at every later step:</text>
  <text class="math txt" x="36" y="516" font-size="17">Δy<tspan dy="5" font-size="12">k</tspan><tspan dy="-5"> / 2δ  ≈  C A</tspan><tspan dy="5" font-size="12">k−1</tspan><tspan dy="-5"> ⋯ A</tspan><tspan dy="5" font-size="12">j+1</tspan><tspan dy="-5"> B</tspan><tspan dy="5" font-size="12">j</tspan></text>

  <!-- mini plot: nominal vs pushed -->
  <g transform="translate(470,398)">
    <line x1="0" y1="100" x2="290" y2="100" stroke="#b3b2ae" stroke-width="1"/>
    <line x1="0" y1="8" x2="0" y2="100" stroke="#b3b2ae" stroke-width="1"/>
    <polyline points="0,70 40,66 80,60 120,56 160,54 200,52 240,51 280,50" fill="none" stroke="#0a0a0a" stroke-width="2"/>
    <polyline points="80,60 120,44 160,34 200,29 240,26 280,25" fill="none" stroke="#b8402a" stroke-width="2"/>
    <line x1="80" y1="8" x2="80" y2="100" stroke="#b8402a" stroke-width="1" stroke-dasharray="3 3"/>
    <text class="mono sm acc" x="86" y="20">push at j</text>
    <text class="mono sm" x="190" y="72">unpushed</text>
    <text class="mono sm acc" x="190" y="16">pushed</text>
    <text class="mono sm" x="240" y="118">time →</text>
  </g>

  <!-- supervises arrow -->
  <path class="wire-a dash" d="M497,378 V335" marker-end="url(#aa)"/>
  <text class="sans sm acc" x="790" y="410">trains F on:</text>
  <text class="sans sm" x="790" y="430">its local response</text>
  <text class="sans sm" x="790" y="450">(exactly what</text>
  <text class="sans sm" x="790" y="470">Riccati uses) and</text>
  <text class="sans sm" x="790" y="490">the unpushed rollout;</text>
  <text class="sans sm" x="790" y="510">no reward, no pixels</text>
</svg>
